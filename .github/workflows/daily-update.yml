name: Daily News Update

on:
  schedule:
    # Run at 00:30 UTC (08:30 Beijing time) every day
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run news scraping script
        run: |
          # The scraping script would update lib/data.ts
          # For now, this is a placeholder that simulates an update
          echo "Running daily news update..."
          # In production, this would run a Python scraping script
          # python scripts/gen.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "Daily news update $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'